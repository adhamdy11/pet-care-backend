<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign up - PetCare</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/theme.js"></script>
</head>
<body class="auth-page">
  <header class="site-header">
    <div class="header-inner">
      <a class="logo" href="/">Pet<span>Care</span></a>
    </div>
  </header>

  <main>
    <div class="card">
      <h1>Create an account</h1>
      <div id="message" class="message hidden"></div>

      <form id="signup-form" novalidate>
        <label>Username
          <input type="text" id="username" autocomplete="username" maxlength="30" required>
        </label>
        <label>Email
          <input type="email" id="email" autocomplete="email" maxlength="254" required>
        </label>
        <label>Password
          <input type="password" id="password" autocomplete="new-password" maxlength="72" required>
          <span class="hint">At least 8 characters, with at least one letter and one number.</span>
        </label>
        <label>Confirm password
          <input type="password" id="confirm-password" autocomplete="new-password" maxlength="72" required>
        </label>
        <button type="submit" id="signup-button">Sign up</button>
      </form>

      <p class="auth-switch">Already have an account? <a href="/login.html">Log in</a></p>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/signup.js"></script>
</body>
</html>
